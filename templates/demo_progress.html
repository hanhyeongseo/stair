<!doctype html><html lang="ko"><meta charset="utf-8"><title>발표 영상 준비 중</title><style>body{font:20px/1.8 sans-serif;background:#14212e;color:white;max-width:850px;margin:70px auto;padding:20px}progress{width:100%}a{color:#8ee6ff}</style><h1>발표용 영상 준비 중</h1><p>dark 영상의 9초 이후 모든 프레임을 미리 분석하고 있습니다. 완료되면 재생 화면으로 전환됩니다.</p><progress id="bar" value="0" max="100"></progress><p id="state">진행 상태 확인 중…</p><a href="/">대시보드</a><script>async function check(){try{const r=await fetch(new URL('progress.json',location.href),{cache:'no-store'});const p=await r.json();document.getElementById('bar').value=p.frames/p.expected*100;document.getElementById('state').textContent=p.status==='encoding'?'브라우저용 MP4로 변환 중…':p.frames+' / '+p.expected+' 프레임 분석';if(p.status==='done'){location.reload();return}}catch(e){}setTimeout(check,5000)}check();</script></html>
